# PIPELINE SPECIFICATION: CARRIER AIR WING (HD REMAKE)
# Standard: ACME Lex Superior v3.2.0 (Article 13, 15: INV-PIPELINE-EXPANSION, DoF = 0)
pipeline_name: caw_hd_remake_engine
version: 1.0.0
target_workspace: solution-b

topology:
  specs_root: specs
  cases_root: cases
  assets_root: assets
  source_root: src
  tests_root: tests

stages:
  - id: STAGE_01_INCEPTION_SPECS
    name: "Inception & Living Specification Lock"
    description: "Establish telos, problem space, invariants, and functional/NFR requirements."
    status: COMPLETED
    artifacts:
      - specs/telos.md
      - specs/problem.md
      - specs/const.md
      - specs/requirements.md
      - cases/CAS_001_inception_storyboard.md
    gates:
      - spec_freeze_verified: true
      - dof_zero_parity: true

  - id: STAGE_02_ASSET_PRODUCTION_GATE
    name: "HD Asset Production & Visual Confinement"
    description: "Generate and sanitize transparent Full HD sprites under strict orthogonal constraints."
    status: IN_PROGRESS
    artifacts:
      - assets/f14_hd.png
      - assets/f18_hd.png
      - assets/a10_hd.png
      - cases/CAS_002_asset_pipeline_rigor.md
    gates:
      - INV_SPRITE_FIT_01: PASSED (Zero truncation, dual-axis safe padding)
      - INV_ORTHO_PERSPECTIVE_03: PASSED (Roll=0, Pitch=0, Yaw=0)
      - enemy_fleet_assets: PENDING (MiG-21, Mi-24, Boss Dreadnought modules)
      - parallax_backdrop_assets: PENDING (Tokyo Bay 4-layer loop)

  - id: STAGE_03_KEYSTONE_CORE_RUNTIME
    name: "Keystone FSM & Deterministic Engine Runtime"
    description: "Implement fixed-timestep loop, zero-GC object pool, and input/state bus."
    status: PLANNED
    prerequisites: [STAGE_01_INCEPTION_SPECS]
    artifacts:
      - src/core/Clock.js
      - src/core/ObjectPool.js
      - src/core/InputBus.js
      - src/core/StateMachine.js
    gates:
      - CONST_TIMESTEP: dt == 1/60s fixed
      - CONST_ZERO_GC: 0 byte heap allocation in tick loop

  - id: STAGE_04_KINETIC_RIG_VIEWPORT
    name: "Fighter Rig & Parallax Viewport Engine"
    description: "Integrate 5-state damped banking rig, afterburner emitter, and 4-layer parallax scrolling."
    status: PLANNED
    prerequisites: [STAGE_02_ASSET_PRODUCTION_GATE, STAGE_03_KEYSTONE_CORE_RUNTIME]
    artifacts:
      - src/render/CanvasRenderer.js
      - src/render/ParallaxViewport.js
      - src/game/FighterRig.js
    gates:
      - banking_fsm_verified: true
      - parallax_modulo_seamless: true

  - id: STAGE_05_COMBAT_WEAPONS_ECONOMY
    name: "Combat Mechanics, Weapons & Dual Vitality Economy"
    description: "Vulcan progression (Lvl 1-6), color-cycling POW capsules, secondary ordnance, and Fuel/Armor timer."
    status: PLANNED
    prerequisites: [STAGE_04_KINETIC_RIG_VIEWPORT]
    artifacts:
      - src/game/WeaponSystem.js
      - src/game/ItemDropSystem.js
      - src/game/CollisionEngine.js
    gates:
      - pow_color_cycle_timer: 2.0s
      - fuel_decay_rate: 1.5 units/s

  - id: STAGE_06_AUDIO_SYNTHESIS_JUICE
    name: "Zero-Latency WebAudio DSP & Kinetic Juice"
    description: "Procedural sound effects (vulcan, missile, explosion), screen shake, and hit-stop FSM."
    status: PLANNED
    prerequisites: [STAGE_05_COMBAT_WEAPONS_ECONOMY]
    artifacts:
      - src/audio/AudioSynthesizer.js
      - src/render/ScreenShake.js
    gates:
      - audio_latency: 0ms external load
      - hitstop_max_duration: 80ms

  - id: STAGE_07_MISSION_STAGES_BOSS_SHOP
    name: "Stage 1 Mission Loop, Boss Battle & Hangar Shop"
    description: "Launch catapult intro, enemy formations, 3-phase Fortress Dreadnought Boss, and Hangar shop intermission."
    status: PLANNED
    prerequisites: [STAGE_06_AUDIO_SYNTHESIS_JUICE]
    artifacts:
      - src/game/StageManager.js
      - src/game/BossDreadnought.js
      - src/ui/ShopUI.js
      - index.html
    gates:
      - boss_phase_destruction_fsm: true
      - shop_bounty_ledger_balanced: true

  - id: STAGE_08_CRUCIBLE_E2E_VERIFICATION
    name: "Crucible Test Suite & Mechanical Verification"
    description: "Automated regression tests covering all invariants (FPS, Memory, Audio, Rig, Viewport)."
    status: PLANNED
    prerequisites: [STAGE_07_MISSION_STAGES_BOSS_SHOP]
    artifacts:
      - tests/test_core_invariants.js
      - tests/test_viewport_invariants.py
      - tests/test_audio_invariants.py
    gates:
      - all_crucible_gates_pass: true

